version: "3.8"

services:
  indic-speak-tts:
    build:
      context: .
      dockerfile: Dockerfile
    image: indic-speak-server:latest
    container_name: indic-speak-tts
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - INDIC_SPEAK_MODEL=bodhan-ai/indic-speak
      - DEVICE=cuda
      - MAX_CONCURRENT_SYNTH=4
      - STREAM_CHUNK_FRAMES=4
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
